name: Build Android app

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "server/**"
      - "guide/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          cd app && npm ci
          pip install pymupdf==1.26.7

      - name: Prepare app files and built-in SRD
        env:
          TV_VERSION: 1.0.${{ github.run_number }}
          TV_REPO: ${{ github.repository }}
          TV_DEFAULT_SERVER: ${{ vars.VAULT_ADDRESS }}
        run: |
          node scripts/copy-web.js
          python scripts/prepare_app.py

      - name: Sync Capacitor
        run: |
          cd app && npx cap sync android
          echo "::notice::Java $(java -version 2>&1 | head -1); ANDROID_HOME=$ANDROID_HOME; platforms: $(ls $ANDROID_HOME/platforms 2>/dev/null | tr '\n' ' ')"

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --stacktrace -PtvVersionCode=${{ github.run_number }} -PtvVersionName=1.0.${{ github.run_number }} 2>&1 | tee build.log; then
            # surface the reason as annotations so it shows on the run page
            grep -A 15 "What went wrong" build.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            grep -iE "error:|e: " build.log | head -15 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../../TomeVault.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TomeVault-apk
          path: TomeVault.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" TomeVault.apk \
            --title "Tome Vault 1.0.${{ github.run_number }}" \
            --notes "Open this page on your Android phone, tap TomeVault.apk to download it, then open it to install. Already have Tome Vault? Installing this updates it and keeps your books."
